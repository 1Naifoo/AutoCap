name: Build AutoCap for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest test_logic.py

      - name: Generate UI Automation wrapper
        run: python -c "import comtypes.client; comtypes.client.GetModule('UIAutomationCore.dll')"

      - name: Build AutoCap.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name AutoCap
          --icon assets/autocap.ico
          --collect-submodules comtypes.gen
          --hidden-import pystray._win32
          autocap.py

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AutoCap-${{ steps.ver.outputs.version }}
          path: |
            Output/AutoCap-Setup.exe
            dist/AutoCap.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoCap ${{ steps.ver.outputs.version }}
          files: |
            Output/AutoCap-Setup.exe
            dist/AutoCap.exe
